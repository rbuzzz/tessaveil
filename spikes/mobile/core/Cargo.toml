[package]
name = "tessaveil-mobile-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Disposable synthetic-only mobile KDF source contract; not production"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
unicode-normalization = "=0.1.24"
zeroize = { version = "=1.8.1", features = ["alloc"] }

[dev-dependencies]
serde_json = "=1.0.145"

# Cargo.lock cannot be generated without Cargo. Transitive resolution, MSRV,
# platform linkage and compilation remain BLOCKED; exact direct pins are not a lock.
