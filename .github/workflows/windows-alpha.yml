{
  "name": "Windows alpha exact-SHA build (fail-closed engineering gate)",
  "on": {
    "push": {"branches": ["feature/windows-alpha"]},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {"contents": "read"},
  "jobs": {
    "windows-alpha": {
      "runs-on": "windows-2022",
      "timeout-minutes": 180,
      "env": {"SOURCE_SHA": "${{ github.sha }}"},
      "defaults": {"run": {"shell": "pwsh"}},
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"ref": "${{ github.sha }}", "fetch-depth": 0, "persist-credentials": false}},
        {"name": "Resolve alpha root on the assigned runner", "id": "alpha-root", "run": "$ErrorActionPreference = 'Stop'\nSet-StrictMode -Version Latest\nforeach ($name in @('RUNNER_TEMP','GITHUB_ENV')) {\n  $value = [Environment]::GetEnvironmentVariable($name)\n  if ([string]::IsNullOrWhiteSpace($value) -or $value -match '[\\r\\n]' -or ![IO.Path]::IsPathFullyQualified($value)) { throw \"Missing or invalid runner input: $name\" }\n}\nif (!(Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container) -or !(Test-Path -LiteralPath $env:GITHUB_ENV -PathType Leaf)) { throw 'Runner environment paths unavailable' }\n$alphaRoot = Join-Path (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path 'tessaveil-alpha'\n[IO.File]::AppendAllText($env:GITHUB_ENV, \"ALPHA_ROOT=$alphaRoot`n\", [Text.UTF8Encoding]::new($false))"},
        {"name": "Pinned tool archives and real static Qt source build", "run": "./packaging/windows/bootstrap.ps1 -ToolchainRoot $env:ALPHA_ROOT"},
        {"name": "Real app build, root Rust, native headful E2E, Python, scanners, LGPL relink and artifact gate", "run": "./packaging/windows/ci.ps1 -ToolchainRoot $env:ALPHA_ROOT -SourceSha $env:SOURCE_SHA"},
        {"name": "Require exact artifact gate receipt", "run": "$receipt = Get-Content -Raw \"$env:ALPHA_ROOT/alpha-output/GATE-PASS.json\" | ConvertFrom-Json; if ($receipt.source_sha -ne $env:SOURCE_SHA) { throw 'Stale gate receipt' }; foreach ($kind in @('runtime','compliance')) { $expected = $receipt.($kind + '_sha256'); if ((Get-FileHash \"$env:ALPHA_ROOT/alpha-output/$kind.zip\" -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Artifact changed after audit' } }; if ((Get-FileHash \"$env:ALPHA_ROOT/alpha-output/release-decision.json\" -Algorithm SHA256).Hash.ToLower() -ne $receipt.decision_sha256) { throw 'Release decision changed after audit' }"},
        {"name": "Upload only after complete same-run compliance gate", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02", "with": {"name": "Tessaveil-unsigned-synthetic-alpha-${{ github.sha }}", "path": "${{ env.ALPHA_ROOT }}/alpha-output/runtime.zip\n${{ env.ALPHA_ROOT }}/alpha-output/compliance.zip\n${{ env.ALPHA_ROOT }}/alpha-output/release-decision.json", "if-no-files-found": "error", "retention-days": 30}},
        {"name": "Visible failure status", "if": "failure()", "run": "'Windows release/freeze: NO-GO. No runtime upload is authorized unless every build, licensing, relink and artifact gate passes. Read failed step; no attestation success is implied.' >> $env:GITHUB_STEP_SUMMARY"}
      ]
    },
    "provenance": {
      "needs": ["windows-alpha"],
      "runs-on": "windows-2022",
      "permissions": {"contents": "read", "id-token": "write", "attestations": "write"},
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"ref": "${{ github.sha }}", "fetch-depth": 1, "persist-credentials": false}},
        {"uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093", "with": {"name": "Tessaveil-unsigned-synthetic-alpha-${{ github.sha }}", "path": "verified-artifact"}},
        {"name": "Official GitHub provenance; unsupported permissions fail visibly", "id": "attest", "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6", "with": {"subject-path": "verified-artifact/runtime.zip\nverified-artifact/compliance.zip\nverified-artifact/release-decision.json", "create-storage-record": false}},
        {"name": "Strict machine-readable attestation verification", "shell": "pwsh", "run": "$ErrorActionPreference = 'Stop'\n$bundle = '${{ steps.attest.outputs.bundle-path }}'\nif ([string]::IsNullOrWhiteSpace($bundle) -or !(Test-Path -LiteralPath $bundle -PathType Leaf)) { throw 'Attestation bundle missing' }\nNew-Item -ItemType Directory -Path provenance-receipts | Out-Null\nExpand-Archive -LiteralPath verified-artifact/runtime.zip -DestinationPath verified-runtime\npython packaging/windows/release_decision.py verify --report verified-artifact/release-decision.json --source-sha $env:GITHUB_SHA --runtime verified-artifact/runtime.zip --compliance verified-artifact/compliance.zip --executable verified-runtime/Tessaveil.exe\nif ($LASTEXITCODE) { throw 'Release decision exact-byte verification failed' }\nforeach ($name in @('runtime.zip','compliance.zip','release-decision.json')) {\n  gh attestation verify \"verified-artifact/$name\" --bundle $bundle --repo $env:GITHUB_REPOSITORY --signer-workflow \"$env:GITHUB_REPOSITORY/.github/workflows/windows-alpha.yml\" --source-digest $env:GITHUB_SHA --source-ref $env:GITHUB_REF --deny-self-hosted-runners --format json | Set-Content -LiteralPath \"provenance-receipts/$name.json\" -Encoding utf8\n  if ($LASTEXITCODE) { throw \"Strict provenance verification failed: $name\" }\n}"},
        {"name": "Upload machine-readable provenance receipts", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02", "with": {"name": "Tessaveil-provenance-verification-${{ github.sha }}", "path": "provenance-receipts/*.json", "if-no-files-found": "error", "retention-days": 30}},
        {"name": "Visible attestation failure", "if": "failure()", "shell": "pwsh", "run": "'GitHub provenance FAILED or unavailable. No successful attestation is claimed. This artifact is not Authenticode-signed and is not RC/stable.' >> $env:GITHUB_STEP_SUMMARY"}
      ]
    }
  }
}
